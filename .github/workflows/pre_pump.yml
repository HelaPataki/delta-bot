name: Pre-pump research
run-name: Pre-pump research ${{ inputs.interval }}

on:
  workflow_dispatch:
    inputs:
      interval:
        description: "Свечи: 4h или 1h"
        type: choice
        options: ["4h", "1h"]
        default: "4h"

permissions:
  contents: write

env:
  START: "2024-07-01"      # свечи с запасом: признакам нужно до 90 дней истории
  SIG_FROM: "2025-01-01"   # пампы и контроль — с этой даты
  INTERVAL: ${{ inputs.interval }}
  DIR: ${{ inputs.interval == '1h' && 'results/pre_pump_1h' || 'results/pre_pump' }}

jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Coins and market caps
        env:
          MODE: prep
        run: python pre_pump.py
      - uses: actions/upload-artifact@v4
        with:
          name: universe
          path: ${{ env.DIR }}/universe.json

  shard:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: universe
          path: ${{ env.DIR }}
      - name: Features (part ${{ matrix.shard }})
        env:
          SHARD: ${{ matrix.shard }}
          NSHARDS: "8"
        run: python pre_pump.py
      - uses: actions/upload-artifact@v4
        with:
          name: part${{ matrix.shard }}
          path: ${{ env.DIR }}/parts/part${{ matrix.shard }}.csv.gz

  combine:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: part*
          path: ${{ env.DIR }}/parts
          merge-multiple: true
      - name: Summary
        env:
          MODE: combine
        run: python pre_pump.py
      - name: Save results
        run: |
          git config user.name "delta-bot"
          git config user.email "delta-bot@users.noreply.github.com"
          git add $DIR/pre_pump_summary.md $DIR/pre_pump_events.csv
          git commit -m "Pre-pump research run ($INTERVAL)" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
