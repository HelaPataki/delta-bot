name: Liquidation fade - features of good longs

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  DIR: results/liq_fade_feat

jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Market caps + spot list
        env:
          MODE: prep
        run: python liq_fade_feat.py
      - uses: actions/upload-artifact@v4
        with:
          name: universe
          path: |
            ${{ env.DIR }}/meta.json

  shard:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: universe
          path: ${{ env.DIR }}
      - name: Features (part ${{ matrix.shard }})
        env:
          SHARD: ${{ matrix.shard }}
          NSHARDS: "8"
        run: python liq_fade_feat.py
      - uses: actions/upload-artifact@v4
        with:
          name: part${{ matrix.shard }}
          path: ${{ env.DIR }}/parts/*${{ matrix.shard }}.csv.gz

  combine:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: universe
          path: ${{ env.DIR }}
      - uses: actions/download-artifact@v4
        with:
          pattern: part*
          path: ${{ env.DIR }}/parts
          merge-multiple: true
      - name: Summary
        env:
          MODE: combine
        run: python liq_fade_feat.py
      - name: Save results
        run: |
          git config user.name "delta-bot"
          git config user.email "delta-bot@users.noreply.github.com"
          git add $DIR/liq_fade_feat_summary.md $DIR/features.csv.gz $DIR/pairs.csv
          git commit -m "Liquidation fade features run" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
