name: BTC filter run

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  btc_filter:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: BTC filter
        run: python btc_filter.py
      - name: Save results
        run: |
          git config user.name "delta-bot"
          git config user.email "delta-bot@users.noreply.github.com"
          git add results/btc_filter
          git commit -m "BTC filter run" || echo "nothing to commit"
          git pull --rebase
          git push
