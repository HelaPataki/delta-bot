name: L3 diagnostics (bot vs archive)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python l3_diag.py
        env:
          COINALYZE_KEY: ${{ secrets.COINALYZE_KEY }}
          CZ_PER_MIN: "10"
      - name: Save results
        if: ${{ !cancelled() }}
        run: |
          git config user.name "delta-bot"
          git config user.email "delta-bot@users.noreply.github.com"
          git add results/l3_diag
          git commit -m "L3 diagnostics run" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
