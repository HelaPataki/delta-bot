name: OI sim run

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Сколько раз повторить симуляцию со случайным выбором монет"
        default: "1000"

permissions:
  contents: write

jobs:
  oi_sim:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Trades with exit time and funding (minutes)
        run: python oi_sim_data.py
      - name: Simulation ($100, 2 slots)
        env:
          N_RUNS: ${{ inputs.runs }}
        run: python oi_sim.py
      - name: Save results
        if: always()
        run: |
          git config user.name "delta-bot"
          git config user.email "delta-bot@users.noreply.github.com"
          git add results/oi_sim || true
          git commit -m "OI sim run" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
