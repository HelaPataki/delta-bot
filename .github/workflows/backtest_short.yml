name: Backtest SHORT run

on:
  workflow_dispatch:
    inputs:
      stop_pct:
        description: "Стоп, % от входа"
        default: "4.3"
      rr:
        description: "Соотношение тейк/стоп"
        default: "1.8"
      vol_min:
        description: "Минимальный множитель объёма"
        default: "3"
      entry_mode:
        description: "Вход: poc = POC − тики, extreme = максимум свечи (с тенью) − тики"
        type: choice
        options: [extreme, poc]
        default: extreme
      ext_ticks:
        description: "Для extreme: на сколько тиков ниже максимума свечи"
        default: "3"
      ext_pct:
        description: "Для extreme: вход на X% выше максимума свечи (0 = считать в тиках)"
        default: "0"
      ticks:
        description: "Для poc: на сколько тиков ниже POC"
        default: "5"

permissions:
  contents: write

jobs:
  backtest_short:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run backtest
        env:
          STOP_PCT: ${{ inputs.stop_pct }}
          RR: ${{ inputs.rr }}
          TICKS: ${{ inputs.ticks }}
          VOL_MIN: ${{ inputs.vol_min }}
          SIDE: short
          ENTRY_MODE: ${{ inputs.entry_mode }}
          EXT_TICKS: ${{ inputs.ext_ticks }}
          EXT_PCT: ${{ inputs.ext_pct }}
        run: python backtest.py
      - name: Save results
        run: |
          git config user.name "delta-bot"
          git config user.email "delta-bot@users.noreply.github.com"
          git add results
          git commit -m "Backtest SHORT run (${{ inputs.entry_mode }}): stop ${{ inputs.stop_pct }}%, RR ${{ inputs.rr }}, ${{ inputs.ticks }} ticks" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
