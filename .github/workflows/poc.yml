name: POC run

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run POC
        run: python poc.py
      - name: Save results
        run: |
          git config user.name "delta-bot"
          git config user.email "delta-bot@users.noreply.github.com"
          git add results
          git commit -m "POC run" || echo "nothing to commit"
          git pull --rebase
          git push
