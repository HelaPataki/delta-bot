name: Live bot

on:
  schedule:
    # за ~2 ч 15 мин до закрытия каждой 4ч-свечи (закрытия в 00, 04, 08, 12, 16, 20 UTC); GitHub часто опаздывает
    - cron: "45 1,5,9,13,17,21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "test — сразу проверить последнюю свечу (сообщения с пометкой ТЕСТ); live — обычный режим"
        default: "test"

permissions:
  contents: write

concurrency:
  group: live-${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy
      - run: python live.py
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          COINALYZE_KEY: ${{ secrets.COINALYZE_KEY }}
      - name: Save state
        if: ${{ !cancelled() }}
        run: |
          git config user.name "delta-bot"
          git config user.email "delta-bot@users.noreply.github.com"
          for f in live_state.json live_signals.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "live: state"
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
