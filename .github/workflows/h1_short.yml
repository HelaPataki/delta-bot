name: 1h short run

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  h1_short:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 1h short
        run: python h1_short.py
      - name: Save results
        run: |
          git config user.name "delta-bot"
          git config user.email "delta-bot@users.noreply.github.com"
          git add results/h1_short
          git commit -m "1h short run" || echo "nothing to commit"
          git pull --rebase
          git push
