name: Backtest run

on:
  workflow_dispatch:
    inputs:
      stop_pct:
        description: "Стоп, % от входа"
        default: "4.3"
      rr:
        description: "Соотношение тейк/стоп"
        default: "1.8"
      ticks:
        description: "Вход: на сколько тиков выше POC"
        default: "5"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run backtest
        env:
          STOP_PCT: ${{ inputs.stop_pct }}
          RR: ${{ inputs.rr }}
          TICKS: ${{ inputs.ticks }}
        run: python backtest.py
      - name: Save results
        run: |
          git config user.name "delta-bot"
          git config user.email "delta-bot@users.noreply.github.com"
          git add results
          git commit -m "Backtest run: stop ${{ inputs.stop_pct }}%, RR ${{ inputs.rr }}, ${{ inputs.ticks }} ticks" || echo "nothing to commit"
          git pull --rebase
          git push
