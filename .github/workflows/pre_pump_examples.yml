name: Pre-pump examples

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Номер случайного выбора (поменяйте, чтобы получить другие две монеты)"
        default: "8"

permissions:
  contents: write

jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Examples
        env:
          SEED: ${{ inputs.seed }}
        run: python pre_pump_examples.py
      - name: Save results
        run: |
          git config user.name "delta-bot"
          git config user.email "delta-bot@users.noreply.github.com"
          git add results/pre_pump_examples/examples.md
          git commit -m "Pre-pump examples" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
