name: Unlocks fetch (DefiLlama open data)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch
        run: python unlocks_fetch.py
      - name: Save
        if: always()
        run: |
          git config user.name "delta-bot"
          git config user.email "delta-bot@users.noreply.github.com"
          git add results/unlocks || true
          git commit -m "Unlocks fetch" || echo "nothing"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
