name: Liquidation fade (blogger)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  DIR: results/liq_fade

jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Coins + liquidations + OI (Coinalyze)
        env:
          MODE: prep
          COINALYZE_KEY: ${{ secrets.COINALYZE_KEY }}
        run: python liq_fade.py
      - uses: actions/upload-artifact@v4
        with:
          name: universe
          path: |
            ${{ env.DIR }}/universe.json
            ${{ env.DIR }}/liq_h.csv.gz
            ${{ env.DIR }}/liq_d.csv.gz
            ${{ env.DIR }}/oi_d.csv.gz

  shard:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: universe
          path: ${{ env.DIR }}
      - name: Signals and trades (part ${{ matrix.shard }})
        env:
          SHARD: ${{ matrix.shard }}
          NSHARDS: "8"
        run: python liq_fade.py
      - uses: actions/upload-artifact@v4
        with:
          name: part${{ matrix.shard }}
          path: ${{ env.DIR }}/parts/*${{ matrix.shard }}.csv.gz

  combine:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: universe
          path: ${{ env.DIR }}
      - uses: actions/download-artifact@v4
        with:
          pattern: part*
          path: ${{ env.DIR }}/parts
          merge-multiple: true
      - name: Summary
        env:
          MODE: combine
        run: python liq_fade.py
      - name: Save results
        run: |
          git config user.name "delta-bot"
          git config user.email "delta-bot@users.noreply.github.com"
          git add $DIR/liq_fade_summary.md $DIR/events.csv.gz $DIR/trades.csv.gz $DIR/liq_h.csv.gz $DIR/liq_d.csv.gz
          git commit -m "Liquidation fade run" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
