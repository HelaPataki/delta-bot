name: Short tests run

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  short_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Short scenarios
        run: python short_tests.py
      - name: Save results
        run: |
          git config user.name "delta-bot"
          git config user.email "delta-bot@users.noreply.github.com"
          git add results/short_tests
          git commit -m "Short tests run" || echo "nothing to commit"
          git pull --rebase
          git push
