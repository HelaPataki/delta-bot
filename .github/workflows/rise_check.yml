name: Rise check run

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rise_check:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Rise check
        run: python rise_check.py
      - name: Save results
        run: |
          git config user.name "delta-bot"
          git config user.email "delta-bot@users.noreply.github.com"
          git add results/rise_check
          git commit -m "Rise check run" || echo "nothing to commit"
          git pull --rebase
          git push
