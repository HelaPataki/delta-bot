name: OI backtest run

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  oi_backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: OI backtest
        run: python oi_backtest.py
      - name: Save results
        run: |
          git config user.name "delta-bot"
          git config user.email "delta-bot@users.noreply.github.com"
          git add results/oi_backtest
          git commit -m "OI backtest run" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
