name: Short exits run

on:
  workflow_dispatch:
    inputs:
      delay:
        description: "Через сколько минут после закрытия свечи вход в шорт"
        default: "8"

permissions:
  contents: write

jobs:
  prescan_check:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      START: "2024-11-01"
      DELAY_MIN: ${{ inputs.delay }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python short_exits.py
      - name: Save results
        if: always()
        run: |
          git config user.name "delta-bot"
          git config user.email "delta-bot@users.noreply.github.com"
          git add results/short_exits* || true
          git commit -m "Short exits run" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
