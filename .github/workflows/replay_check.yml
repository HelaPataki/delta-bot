name: Replay check (temporary)

on:
  workflow_dispatch:
    inputs:
      what:
        description: "extras — разбор лишних по архиву; full — полный прогон; twap — прогноз в точке против среднего"
        default: extras
        type: choice
        options: [extras, full, twap]

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy pandas
      - run: python replay_${{ inputs.what == 'full' && 'check' || inputs.what }}.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          COINALYZE_KEY: ${{ secrets.COINALYZE_KEY }}
