name: Replay check (temporary)

on:
  workflow_dispatch:
    inputs:
      what:
        description: "extras — разбор лишних по архиву (быстро); full — полный прогон через Coinalyze"
        default: extras
        type: choice
        options: [extras, full]

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy pandas
      - run: python ${{ inputs.what == 'full' && 'replay_check.py' || 'replay_extras.py' }}
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          COINALYZE_KEY: ${{ secrets.COINALYZE_KEY }}
