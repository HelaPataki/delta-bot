name: History run

on:
  workflow_dispatch:
    inputs:
      delta_pct:
        description: "Порог дельты, % (сигнал при >= +X или <= -X)"
        default: "17"
      min_turnover:
        description: "Минимальный оборот 4h-свечи, USDT"
        default: "50000"
      start:
        description: "Начало периода"
        default: "2025-01-01"

permissions:
  contents: write

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run history
        env:
          DELTA_PCT: ${{ inputs.delta_pct }}
          MIN_TURNOVER: ${{ inputs.min_turnover }}
          START: ${{ inputs.start }}
        run: python history.py
      - name: Save results
        run: |
          git config user.name "delta-bot"
          git config user.email "delta-bot@users.noreply.github.com"
          git add results
          git commit -m "History run: delta ${{ inputs.delta_pct }}%, turnover ${{ inputs.min_turnover }}" || echo "nothing to commit"
          git pull --rebase
          git push
